name: skillora_family
description: Companion mobile app for Skillora (Family - Parents & Students)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.3
  intl: ^0.20.2
  http: ^1.2.2
  json_annotation: ^4.9.0
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^6.2.1
  logger: ^2.0.2+1
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1
  flutter_svg: ^2.0.10+1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/app_icon/
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon/skillora_icon.png"

flutter_intl:
  enabled: true
